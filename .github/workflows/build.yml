name: Build

on:
  push:
    branches:
      - master
      - svelte5-migration
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        with:
          projectBaseDir: mewdash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
