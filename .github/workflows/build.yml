name: Build and Analyze

on:
  push:
    branches:
      - master
      - svelte5-migration
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mewdash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabled for better SonarQube analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mewdash/package-lock.json

      - name: Configure Font Awesome Pro
        run: |
          echo "@awesome.me:registry=https://npm.fontawesome.com/" >> ~/.npmrc
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> ~/.npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Run linting
        run: npm run lint
        continue-on-error: true  # Don't fail build on lint warnings

      - name: Build project
        run: npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        with:
          projectBaseDir: mewdash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
